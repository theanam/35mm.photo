name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests gate the deploy: the CPU side of the pipeline — geometry maths,
      # the camera-profile parser, LUT construction — is where a silent
      # regression would otherwise reach the site looking fine.
      - run: npm test
      # `build` runs tsc first, so a type error fails the deploy. The site is
      # served from an apex domain set in the repo's Pages settings (an artifact
      # CNAME file is ignored when publishing from Actions), so vite's default
      # base of "/" is right; set BASE_PATH=/<repo>/ if that domain goes away.
      - run: npm run build
        env:
          # Analytics ships on the published site only — see the analytics()
          # plugin in vite.config.ts. Local and fork builds stay untagged.
          GA_MEASUREMENT_ID: G-GDZ2BFDREX
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
