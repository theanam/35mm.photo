<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to
         anything but zero. Without it the status-bar-style below draws the app
         under the notch with no way to pad away from it. No user-scalable=no:
         pinching the page is a legitimate way to read small type. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>35mm — a full-featured photo editor in your browser</title>
    <meta
      name="description"
      content="A full-featured photo editor in your browser. Camera raw development, GPU colour grading, curves, an HSL mixer, crop and export — all inside the browser tab, with nothing to install and no account to make."
    />
    <link rel="canonical" href="https://35mm.photo/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Installed-app chrome. apple-mobile-web-app-capable is the deprecated
         spelling of mobile-web-app-capable, but iOS still only reads its own. -->
    <meta name="theme-color" content="#141312" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="35mm" />
    <meta name="apple-mobile-web-app-title" content="35mm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Open Graph. Absolute URLs: crawlers do not resolve these against base. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="35mm" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="35mm — a full-featured photo editor in your browser" />
    <meta
      property="og:description"
      content="Camera raw development, GPU colour grading, curves, an HSL mixer, crop and export — all inside the browser tab. Nothing to install, no account to make."
    />
    <meta property="og:url" content="https://35mm.photo/" />
    <meta property="og:image" content="https://35mm.photo/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The 35mm.photo lockup on a dark ground, above the line: a full-featured photo editor in your browser."
    />

    <!-- X/Twitter falls back to og:* for most of these, but Slack, Discord and
         iMessage read the explicit ones. No site/creator handle to claim. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="35mm — a full-featured photo editor in your browser" />
    <meta
      name="twitter:description"
      content="Camera raw development, GPU colour grading, curves, an HSL mixer, crop and export — all inside the browser tab. Nothing to install, no account to make."
    />
    <meta name="twitter:image" content="https://35mm.photo/og.png" />
    <meta
      name="twitter:image:alt"
      content="The 35mm.photo lockup on a dark ground, above the line: a full-featured photo editor in your browser."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "35mm",
        "alternateName": "35mm.photo",
        "url": "https://35mm.photo/",
        "description": "A full-featured photo editor in your browser. Camera raw development, GPU colour grading, curves, an HSL mixer, crop and export \u2014 all inside the browser tab, with nothing to install and no account to make.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any, in a modern web browser",
        "browserRequirements": "Requires JavaScript and WebGL2",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "screenshot": "https://35mm.photo/og.png",
        "featureList": [
          "Opens JPEG, PNG, HEIC, WEBP, AVIF, GIF and BMP",
          "Develops camera raw: RAF, RW2, CR2, CR3, NEF, ARW, DNG, ORF, PEF and more",
          "GPU colour grading: light, curves, HSL mixer, detail and grain",
          "Nine looks",
          "Crop and straighten",
          "Non-destructive edit stack, saved to a sidecar beside the photo",
          "Live histogram and RGB parade",
          "Installs as a PWA and works offline"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Three ways a browser can fail to show the editor, caught in plain script
      that any browser runs, because the app itself is a modern module and a
      browser that cannot run one would otherwise show a blank page.

      The nomodule block is only run by browsers with no module support at
      all, which is the one deterministic test for "too old". The watchdog
      catches the app's own startup failing — a module this browser can fetch
      but not parse, a missing API at load — and says so, with the error, in
      place of the blank page. It never fires once the app has mounted, and
      the app removes it if it mounts anyway, so a slow network can only ever
      cost a flash of it, never the editor.
    -->
    <noscript>
      <div style="font: 16px/1.5 system-ui, sans-serif; color: #ece7de; background: #141312; min-height: 100vh; padding: 48px 24px; box-sizing: border-box;">
        <h1 style="font-size: 22px; font-weight: 600; margin: 0 0 12px;">35mm needs JavaScript</h1>
        <p style="max-width: 36em; margin: 0; color: #b8b2a8;">The whole editor runs in your browser tab, so there is nothing to show without it.</p>
      </div>
    </noscript>
    <script nomodule>
      document.getElementById('root').innerHTML =
        '<div style="font: 16px/1.5 system-ui, sans-serif; color: #ece7de; background: #141312; min-height: 100vh; padding: 48px 24px; box-sizing: border-box;">' +
        '<h1 style="font-size: 22px; font-weight: 600; margin: 0 0 12px;">35mm needs a newer browser</h1>' +
        '<p style="max-width: 36em; margin: 0 0 12px; color: #b8b2a8;">It develops, grades and exports photos on your own machine, using parts of the web platform this browser does not have. The current Chrome, Edge, Firefox or Safari all work, and updating this one may be enough.</p>' +
        '<p style="max-width: 36em; margin: 0; color: #b8b2a8;">If you are reading this inside another app &mdash; a link opened from Facebook, Instagram or a mail app &mdash; try opening the page in your browser instead.</p>' +
        '</div>'
    </script>
    <script>
      ;(function () {
        var ready = false
        var shown = false
        window.__35mm = {
          ready: function () {
            ready = true
            var note = document.getElementById('startup-failed')
            if (note && note.parentNode) note.parentNode.removeChild(note)
          },
        }
        window.addEventListener(
          'error',
          function (event) {
            if (ready || shown) return
            // Only the app's own files: an extension's script throwing says
            // nothing about this browser, and a cross-origin error has no
            // message to show anyway.
            var file = event && event.filename ? String(event.filename) : ''
            var message = event && event.message ? String(event.message) : ''
            if (!file || file.indexOf(window.location.origin) !== 0 || !message || message === 'Script error.') return
            shown = true
            var note = document.createElement('div')
            note.id = 'startup-failed'
            note.setAttribute('style', 'position: fixed; inset: 0; z-index: 100; font: 16px/1.5 system-ui, sans-serif; color: #ece7de; background: #141312; padding: 48px 24px; box-sizing: border-box; overflow: auto;')
            note.innerHTML =
              '<h1 style="font-size: 22px; font-weight: 600; margin: 0 0 12px;">35mm could not start in this browser</h1>' +
              '<p style="max-width: 36em; margin: 0 0 12px; color: #b8b2a8;">Its code loaded but could not run, which usually means the browser is a few years behind. The current Chrome, Edge, Firefox or Safari all work, and updating this one may be enough.</p>' +
              '<p style="max-width: 36em; margin: 0 0 18px; color: #b8b2a8;">If you are inside another app, try opening the page in your browser instead.</p>' +
              '<pre style="max-width: 36em; margin: 0 0 18px; padding: 12px; font: 12px/1.5 ui-monospace, monospace; color: #b8b2a8; background: #1d1b18; border-radius: 6px; white-space: pre-wrap; word-break: break-word;"></pre>' +
              '<button type="button" style="font: inherit; color: #141312; background: #c9a227; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer;">Try again</button>'
            note.querySelector('pre').textContent = message
            note.querySelector('button').onclick = function () { window.location.reload() }
            document.body.appendChild(note)
          },
          true
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
